<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Ride Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">

<!-- ▼ LEAFLET CSS — muss VOR dem leaflet.js stehen -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

<style>
:root {
  --bg: #0d1b2a;
  --bg-1: #11243a;
  --bg-2: #17304a;
  --line: rgba(224,225,221,0.09);
  --line-strong: rgba(224,225,221,0.18);
  --fg: #e0e1dd;
  --fg-dim: rgba(224,225,221,0.62);
  --fg-faint: rgba(224,225,221,0.38);
  --accent: #4cc9f0;
  --accent-ink: #062433;
  --warm: #f4b860;
  --danger: #e07a5f;
  --ok: #9bd1a4;
  --radius: 14px;
  --radius-sm: 8px;
  --radius-lg: 22px;
  --shadow: 0 10px 40px -12px rgba(0,0,0,.5), 0 2px 6px -2px rgba(0,0,0,.3);
  --pad: 20px;
  --gap: 16px;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --sans: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
}

[data-theme="dawn"] {
  --bg: #f6f2ea;
  --bg-1: #ffffff;
  --bg-2: #ebe4d6;
  --line: rgba(20,20,20,0.10);
  --line-strong: rgba(20,20,20,0.22);
  --fg: #141414;
  --fg-dim: rgba(20,20,20,0.62);
  --fg-faint: rgba(20,20,20,0.38);
  --accent-ink: #ffffff;
  --shadow: 0 10px 30px -16px rgba(20,20,20,.2), 0 1px 2px rgba(20,20,20,.06);
}

[data-density="dense"] {
  --pad: 14px;
  --gap: 10px;
}

* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
body { min-height: 100vh; font-feature-settings: "ss01","cv11"; }
button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font-family: inherit; color: inherit; }
a { color: inherit; }

.app {
  max-width: 1320px;
  margin: 0 auto;
  padding: 24px;
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 20px;
}
@media (max-width: 720px) {
  .app { padding: 14px; gap: 14px; }
}

/* ========== HEADER ========== */
.header {
  /* 3-column grid: brand | tabs | meta.
     The centre column is auto-sized and centred so neither Brand nor
     header-meta can push the tabs sideways when their own content changes.
     A fixed min-height anchors the row track so the tab bar's Y position
     is independent of which tab's content renders below. */
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  min-height: 56px;
}
.header .tabs {
  justify-self: center;
  /* Small downward nudge so the pill breathes a bit from the top of the page. */
  margin-top: 8px;
}
.header .header-meta { justify-self: end; }
.brand {
  display: block;
  width: 130px;
  height: 38px;
  margin-left: 16px;
  background: url("logo-dark.png") no-repeat left center;
  background-size: auto 100%;
}
[data-theme="dawn"] .brand {
  background-image: url("logo.png");
}

.tabs {
  display: inline-flex;
  gap: 2px;
  padding: 4px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 100px;
}
.tab {
  padding: 6px 16px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-dim);
  letter-spacing: -0.01em;
  white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
  /* Transition only colour properties — never width-affecting ones. */
  transition: background .18s ease, color .18s ease;
}
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] {
  background: var(--accent);
  color: var(--accent-ink);
}

.header-meta {
  display: flex; align-items: center; gap: 12px;
  font-size: 13px; color: var(--fg-dim);
}
.header-meta .pill {
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 100px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
@media (max-width: 720px) {
  .header-meta { display: none; }
  /* Collapse to just the bike-in-circle (the leftmost ~32% of the logo). */
  .brand { width: 38px; }
}

/* ========== CONTENT AREA ========== */
.view { display: contents; }

/* ========== TRAINING ========== */
.training-layout {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 980px) {
  .training-layout { grid-template-columns: 1fr; }
}

.card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: var(--pad);
}

.card-title {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 16px;
}
.card-title h2 {
  margin: 0;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: -0.02em;
}
.card-title .sub {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--fg-faint);
}

.goal-group { display: grid; gap: 14px; }
.goal-row { display: grid; gap: 6px; }
.goal-row > label {
  font-size: 12px;
  color: var(--fg-dim);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.num-input {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: border-color .18s;
}
.num-input:focus-within { border-color: var(--accent); }
.num-input input {
  background: transparent;
  border: 0;
  outline: 0;
  font-family: var(--mono);
  font-size: 28px;
  font-weight: 500;
  width: 100%;
  letter-spacing: -0.02em;
}
.num-input .suffix {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--fg-dim);
}

.date-chips {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.date-chip {
  padding: 10px 14px;
  font-size: 13px;
  border: 1px solid var(--line);
  border-radius: 100px;
  background: transparent;
  color: var(--fg-dim);
  transition: all .18s;
}
.date-chip:hover { color: var(--fg); border-color: var(--line-strong); }
.date-chip[aria-pressed="true"] {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--fg);
}

.seg {
  display: inline-flex;
  padding: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 100px;
  width: 100%;
}
.seg button {
  flex: 1;
  padding: 9px 10px;
  font-size: 13px;
  border-radius: 100px;
  color: var(--fg-dim);
  transition: all .18s;
}
.seg button[aria-pressed="true"] {
  background: var(--bg-2);
  color: var(--fg);
}

.plan-hero {
  position: relative;
  overflow: hidden;
  padding: 28px;
  border-radius: var(--radius-lg);
  background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
  border: 1px solid var(--line);
  display: grid;
  gap: 24px;
}
.plan-hero::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 100% 0%, color-mix(in oklch, var(--accent) 14%, transparent), transparent 50%);
  pointer-events: none;
}
.plan-hero > * { position: relative; z-index: 1; }

/* Plan summary: single row of 5 metrics, never wraps. */
.plan-meta {
  display: flex;
  flex-wrap: nowrap;
  gap: 0 40px;
  padding-right: 44px;
  overflow-x: auto;
  position: relative;
  z-index: 10;  /* sit above phase-strip sibling (also z-index:1 from plan-hero > *) */
}
.plan-meta-cell {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}
.plan-meta .tip-wrap { display: inline-flex; flex-direction: column; }
.plan-meta .big {
  font-family: var(--serif);
  font-size: clamp(28px, 3.5vw, 44px);
  font-style: italic;
  line-height: 1;
  letter-spacing: -0.02em;
}
.plan-meta .label {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--fg-dim);
}
.plan-meta .val {
  font-family: var(--mono);
  font-size: clamp(13px, 1.5vw, 18px);
  font-weight: 500;
}

.volume-graph {
  display: grid;
  grid-template-columns: repeat(var(--cols, 6), 1fr);
  gap: 8px;
  height: 90px;
  align-items: end;
}
.vol-bar {
  position: relative;
  border-radius: 6px 6px 2px 2px;
  background: linear-gradient(180deg, var(--accent), color-mix(in oklch, var(--accent) 50%, transparent));
  transition: all .4s cubic-bezier(.2,.8,.2,1);
  min-height: 4px;
}
.vol-bar.rest {
  /* --ok (sage green) signals "ease" clearly vs the blue training bars. */
  background: linear-gradient(180deg,
    color-mix(in oklch, var(--ok) 60%, var(--bg-2)),
    color-mix(in oklch, var(--ok) 32%, transparent));
  opacity: 0.82;
}
.vol-bar-label {
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.vol-bar-recovery {
  position: absolute;
  bottom: -32px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ok);
  opacity: 0.8;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.vol-bar-rest-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 13px;
  color: var(--ok);
  opacity: 0.75;
  pointer-events: none;
}
.volume-graph-wrap { padding-bottom: 34px; }

/* All 7 cards in one grid row → auto same height (tallest sets the row).
   --week-cols is set inline per week (1.3fr for training days, 1fr for rest). */
.week-grid {
  display: grid;
  grid-template-columns: var(--week-cols, repeat(7, 1fr));
  grid-auto-rows: 1fr;
  gap: 10px;
}
@media (max-width: 720px) {
  .week-grid { grid-template-columns: repeat(2, 1fr) !important; grid-auto-rows: auto; }
}
.day-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: stretch;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  overflow: hidden;
}
.day-card:hover { border-color: var(--line-strong); background: color-mix(in oklch, var(--fg) 3%, var(--bg)); }
.day-card.selected {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
  background: var(--bg);
}
.day-head {
  display: flex; justify-content: space-between; align-items: baseline;
  flex-shrink: 0;
}
.day-dow {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-dim);
}
.day-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-faint);
}
.day-type {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.day-subtitle {
  font-size: 10px;
  color: var(--fg-dim);
  line-height: 1.3;
  font-family: var(--serif);
  font-style: italic;
}
/* Three vertically-stacked metric rows: label left, value right. */
.day-stats {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-top: 2px;
  flex: 1;          /* grow to fill the card, pushing dots+TSS to bottom */
  justify-content: flex-start;
}
.day-stat-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 4px;
}
.day-stat-label {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-faint);
  white-space: nowrap;
  flex-shrink: 0;
}
.day-stat-val {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--fg);
  white-space: nowrap;
}
/* Difficulty dots — its own row below the stats. */
.day-difficulty-row {
  margin-top: auto;
  padding-top: 4px;
}
.day-difficulty {
  display: flex;
  align-items: center;
  gap: 3px;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--line-strong);
  display: inline-block;
  flex: none;
}
.dot.dot-on { background: var(--accent); }
.difficulty-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-dim);
  margin-left: 4px;
}
/* TSS — its own row at the very bottom. */
.day-tss-row {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-faint);
}

/* Rest day card */
.day-rest { cursor: pointer; }
.day-rest-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  justify-content: center;
}
.day-rest .day-type {
  color: var(--fg-dim);
  font-size: 14px;
}
.day-rest .day-subtitle {
  color: var(--fg-faint);
  font-size: 10px;
}

.workout-detail { display: grid; gap: 18px; }
.workout-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px;
}
.workout-title h3 {
  margin: 0 0 6px 0;
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.workout-meta {
  display: flex; gap: 18px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.intervals { display: grid; gap: 8px; }
.interval-row {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  background: var(--bg);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  transition: all .18s;
}
.interval-row:hover { border-color: var(--line-strong); }
.interval-zone {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 4px;
  text-align: center;
  color: #0a0a0a;
}
.interval-label { font-size: 14px; }
.interval-detail {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.interval-duration {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--fg);
  font-weight: 500;
}

.interval-viz {
  display: grid;
  gap: 4px;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  height: 70px;
  align-items: end;
  padding: 14px;
  background: var(--bg);
  border-radius: var(--radius);
  border: 1px solid var(--line);
}
.viz-block {
  background: var(--z-color);
  border-radius: 3px 3px 1px 1px;
  transition: all .3s cubic-bezier(.2,.8,.2,1);
  min-width: 2px;
}

.zones { display: grid; gap: 8px; }
.zone-row {
  display: grid;
  grid-template-columns: 20px 88px 1fr;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.zone-swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
.zone-row .tip-wrap { overflow: hidden; }
.zone-row .tip-trigger { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zone-range {
  font-family: var(--mono); font-size: 11px; color: var(--fg-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ========== TOUR PLANNER ========== */
.tour-layout {
  display: grid;
  /* minmax(0, 1fr) is critical: without it the map column defaults to
     min-content and Leaflet's tiles can push the column wider than its
     share, overflowing leftward into the planner. */
  grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
@media (max-width: 1024px) {
  .tour-layout { grid-template-columns: 1fr; }
}

/* ▼ Map card — feste Höhe ist PFLICHT für Leaflet */
.map-card {
  padding: 0;
  overflow: hidden;
  position: relative;
  height: 480px;        /* ← feste Pixel-Höhe, kein aspect-ratio */
  min-height: 480px;
}
@media (max-width: 720px) {
  .map-card { height: 360px; min-height: 360px; }
}

/* ▼ Leaflet-Container füllt die card komplett aus */
.map-card .leaflet-container {
  width: 100% !important;
  height: 100% !important;
}

.map-overlay {
  position: absolute;
  left: 16px; top: 16px;
  padding: 8px 12px;
  background: color-mix(in oklch, var(--bg-1) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line-strong);
  border-radius: 100px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-dim);
  display: flex; align-items: center; gap: 8px;
  z-index: 1000;
  flex-wrap: wrap;
}
.map-overlay .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.map-legend {
  position: absolute; right: 16px; bottom: 16px;
  padding: 10px 14px;
  background: color-mix(in oklch, var(--bg-1) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  font-family: var(--mono);
  font-size: 10px;
  display: grid; gap: 4px;
  color: var(--fg-dim);
  z-index: 1000;
}
.map-legend span::before {
  content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
.map-legend .hotel::before { background: var(--warm); }
.map-legend .city::before  { background: var(--accent); }

/* ▼ Leaflet Popup ans Theme anpassen */
.leaflet-popup-content-wrapper {
  background: var(--bg-1) !important;
  color: var(--fg) !important;
  border: 1px solid var(--line-strong) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow) !important;
}
.leaflet-popup-tip { background: var(--bg-1) !important; }
.leaflet-popup-content { margin: 12px 14px !important; }
.leaflet-control-zoom {
  border: 1px solid var(--line-strong) !important;
  border-radius: var(--radius-sm) !important;
  overflow: hidden;
}
.leaflet-control-zoom a {
  background: var(--bg-1) !important;
  color: var(--fg) !important;
  border-bottom: 1px solid var(--line) !important;
}
.leaflet-control-zoom a:hover { background: var(--bg-2) !important; }
.leaflet-control-attribution {
  background: color-mix(in oklch, var(--bg-1) 80%, transparent) !important;
  color: var(--fg-faint) !important;
  font-size: 9px !important;
}
.leaflet-control-attribution a { color: var(--fg-dim) !important; }
.leaflet-div-icon { background: none !important; border: none !important; }

/* Tour form */
.input-field {
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: grid; gap: 4px;
  transition: border-color .18s;
}
.input-field:focus-within { border-color: var(--accent); }
.input-field label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--fg-faint);
}
.input-field input {
  background: transparent;
  border: 0; outline: 0;
  font-size: 15px;
  padding: 0;
}
.input-field[aria-invalid="true"],
.input-field:has(input[aria-invalid="true"]) {
  border-color: color-mix(in oklch, var(--danger) 60%, transparent);
}
.input-error {
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.4;
  color: var(--danger, #c0392b);
}
.input-hint {
  margin-top: 4px;
  font-size: 11px;
  color: var(--fg-faint);
  font-family: var(--mono);
}
.swap-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--bg-1);
  display: grid; place-items: center;
  color: var(--fg-dim);
  transition: all .18s;
  margin: -10px 0 -10px auto;
  position: relative;
  z-index: 1;
}
.swap-btn:hover { color: var(--fg); border-color: var(--line-strong); transform: rotate(180deg); }

.from-to {
  display: grid;
  gap: 8px;
  position: relative;
}
.from-to::before {
  content: ""; position: absolute;
  left: 20px; top: 38px; bottom: 38px;
  width: 2px;
  background: repeating-linear-gradient(180deg, var(--line-strong) 0 3px, transparent 3px 6px);
}
.from-to .input-field {
  padding-left: 38px;
  position: relative;
}
.from-to .input-field::before {
  content: "";
  position: absolute;
  left: 14px; top: 18px;
  width: 10px; height: 10px;
  border-radius: 50%;
}
.from-to .input-field:first-child::before {
  background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent);
}
.from-to .input-field:last-child::before {
  background: transparent;
  border: 2px solid var(--accent);
}

.range-row {
  display: grid; gap: 10px;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.range-label {
  display: flex; justify-content: space-between; align-items: baseline;
}
.range-label .tag {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--fg-faint);
}
.range-label .val {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.range-label .val em { color: var(--fg-dim); font-style: normal; font-size: 12px; margin-left: 4px; }

input[type="range"] {
  appearance: none;
  width: 100%;
  background: transparent;
  height: 24px;
  margin: 0;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--line-strong);
  border-radius: 2px;
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent);
  margin-top: -8px;
  box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 20%, transparent);
  transition: box-shadow .18s;
}
input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 8px color-mix(in oklch, var(--accent) 20%, transparent); }
input[type="range"]::-moz-range-track { height: 2px; background: var(--line-strong); border-radius: 2px; }
input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%; border: 0;
  background: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 20%, transparent);
}

.itinerary { display: grid; gap: 12px; }
.stage {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 14px;
  padding: 16px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all .2s;
}
.stage:hover { border-color: var(--line-strong); }
.stage.active { border-color: var(--accent); background: color-mix(in oklch, var(--accent) 5%, var(--bg-1)); }
.stage-num {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  display: grid; place-items: center;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 500;
}
.stage.active .stage-num { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.stage-body { display: grid; gap: 10px; }
.stage-route {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 500; letter-spacing: -0.01em; flex-wrap: wrap;
}
.stage-route .arrow { font-family: var(--mono); color: var(--fg-faint); font-size: 13px; }
.stage-date {
  margin-left: auto;
  font-family: var(--mono); font-size: 11px;
  color: var(--fg-dim); letter-spacing: 0.04em;
  padding: 2px 8px; border: 1px solid var(--line);
  border-radius: 999px; white-space: nowrap;
}
.stage-stats {
  display: flex; gap: 18px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-dim);
}
.stage-stats span strong { color: var(--fg); font-weight: 500; margin-right: 4px; }

.elev-strip { height: 40px; position: relative; margin-top: 6px; }
.elev-strip svg { width: 100%; height: 100%; display: block; }

.stage-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 6px;
  width: 100%;
}
.stage-dest-btn,
.stage-day-btn {
  padding: 8px 16px;
  font-size: 12px;
  width: 100%;
  min-width: 0;
  white-space: nowrap;
}
/* Stack as soon as both labels can no longer comfortably fit side-by-side
   on a single line — keeps each button full-width on phones. */
@media (max-width: 640px) {
  .stage-actions { grid-template-columns: 1fr; }
}

/* ========== DESTINATION MODAL (OSM POI lists) ========== */
.dest-section + .dest-section { margin-top: 8px; }
.dest-section h3 {
  margin: 0 0 10px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--fg-dim);
  font-weight: 500;
  display: flex; gap: 8px; align-items: baseline;
}
.dest-count {
  font-size: 10px;
  color: var(--fg-faint);
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.dest-list {
  list-style: none; padding: 0; margin: 0;
  display: grid; gap: 8px;
}
.dest-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.dest-main { min-width: 0; }
.dest-name {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.dest-meta {
  font-size: 12px;
  color: var(--fg-dim);
  margin-top: 2px;
}
.dest-links {
  display: flex; flex-direction: column;
  gap: 4px; align-items: flex-end;
  font-size: 12px; white-space: nowrap;
}
.dest-links a { color: var(--accent); }
.dest-links a:hover { text-decoration: underline; }
.dest-empty,
.dest-error {
  padding: 12px;
  background: var(--bg);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  font-size: 13px; color: var(--fg-dim);
  display: grid; gap: 10px; justify-items: start;
}
.dest-error .btn,
.dest-empty .btn { padding: 8px 14px; font-size: 12px; }
.dest-skeleton { display: grid; gap: 10px; }
.dest-skel-row {
  height: 44px;
  background: linear-gradient(90deg, var(--bg) 0%, var(--bg-1) 50%, var(--bg) 100%);
  background-size: 200% 100%;
  border-radius: var(--radius);
  animation: dest-shimmer 1.4s ease-in-out infinite;
}
@keyframes dest-shimmer {
  from { background-position: 200% 0; }
  to   { background-position: -200% 0; }
}

/* ========== SAVED TOURS DROPDOWN ========== */
.saved-dropdown {
  position: relative;
}
.saved-toggle {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  text-align: left;
  font-size: 14px;
  color: var(--fg);
  transition: all .15s;
  cursor: pointer;
}
.saved-toggle:hover:not(:disabled) { border-color: var(--accent); }
.saved-toggle:disabled { opacity: 0.6; cursor: default; }
.saved-toggle-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.saved-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-faint);
  padding: 1px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.saved-caret {
  color: var(--fg-faint);
  font-size: 12px;
}
.saved-menu {
  list-style: none; padding: 4px; margin: 4px 0 0;
  position: absolute;
  top: 100%; left: 0; right: 0;
  /* Leaflet's internal panes/controls go up to ~700; the dropdown
     menu must sit above them so it isn't covered by the map. */
  z-index: 1000;
  background: var(--bg-1);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  max-height: 320px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: grid;
  gap: 2px;
}
.saved-menu-item {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  border-radius: calc(var(--radius) - 2px);
  cursor: pointer;
  transition: background .12s;
  outline: none;
}
.saved-menu-item:hover,
.saved-menu-item:focus-visible {
  background: var(--bg);
}
.saved-menu-item.active {
  background: color-mix(in oklch, var(--accent) 10%, transparent);
}
.saved-active-dot {
  width: 18px;
  text-align: center;
  color: var(--accent);
  font-size: 14px;
  line-height: 1;
}
.saved-main { min-width: 0; }
.saved-name {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.saved-stats {
  display: flex; gap: 6px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px;
  color: var(--fg-dim);
}
.saved-trash {
  width: 30px; height: 30px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 999px;
  color: var(--fg-dim);
  font-size: 14px;
  line-height: 1;
  transition: all .15s;
}
.saved-trash:hover {
  color: var(--danger);
  border-color: color-mix(in oklch, var(--danger) 60%, transparent);
}
.saved-empty {
  margin: 8px 0 0;
  font-size: 13px;
  color: var(--fg-dim);
  padding: 12px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  text-align: center;
}
.saved-menu-clear {
  list-style: none;
  margin-top: 4px;
  padding: 6px 6px 2px;
  border-top: 1px solid var(--line);
}
.saved-clear-all {
  width: 100%;
  padding: 8px 10px;
  background: transparent;
  border: 1px dashed var(--line);
  border-radius: calc(var(--radius) - 2px);
  color: var(--fg-dim);
  font-size: 12px;
  font-family: var(--mono);
  letter-spacing: 0.04em;
  transition: all .15s;
  cursor: pointer;
}
.saved-clear-all:hover {
  color: var(--danger);
  border-color: color-mix(in oklch, var(--danger) 60%, transparent);
  border-style: solid;
}
.storage-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: color-mix(in oklch, var(--danger) 12%, transparent);
  border: 1px solid color-mix(in oklch, var(--danger) 60%, transparent);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--fg);
}
.storage-banner span { flex: 1; }
.storage-banner-close {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--bg-1);
  color: var(--fg-dim);
  font-size: 14px;
  line-height: 1;
}
@media (max-width: 640px) {
  .saved-menu {
    position: fixed;
    left: 0; right: 0; top: auto;
    margin: 0;
    border-radius: var(--radius) var(--radius) 0 0;
    max-height: 60vh;
  }
}

/* ========== TOUR DAY MODAL (elevation profile) ========== */
.tour-day-section {
  padding: 14px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.elev-chart-wrap {
  position: relative;
  width: 100%;
  margin-top: 4px;
}
.elev-chart {
  display: block;
  width: 100%;
  touch-action: pan-y;
}
.elev-area { fill: color-mix(in oklch, var(--accent) 22%, transparent); }
.elev-line { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; }
.elev-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.elev-axis {
  font-family: var(--mono);
  font-size: 10px;
  fill: var(--fg-faint);
}
.elev-guide { stroke: var(--fg-dim); stroke-width: 1; stroke-dasharray: 2 3; }
.elev-dot { fill: var(--accent); stroke: var(--bg-1); stroke-width: 2; }
.elev-tip {
  position: absolute;
  top: 6px;
  transform: translateX(-50%);
  background: var(--bg-1);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 4px 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg);
  white-space: nowrap;
  pointer-events: none;
  box-shadow: var(--shadow);
}
.elev-skeleton {
  height: 220px;
  border-radius: var(--radius);
  background: linear-gradient(90deg, var(--bg) 0%, var(--bg-1) 50%, var(--bg) 100%);
  background-size: 200% 100%;
  animation: dest-shimmer 1.4s ease-in-out infinite;
}
.elev-empty {
  padding: 12px;
  font-size: 13px;
  color: var(--fg-dim);
}
.elev-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  margin-top: 12px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.elev-stats > div {
  padding: 10px 12px;
  background: var(--bg-1);
  display: grid;
  gap: 2px;
}
.elev-stats .lbl {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--fg-faint);
}
.elev-stats .big {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 500;
  color: var(--fg);
}
@media (max-width: 480px) {
  .elev-stats { grid-template-columns: repeat(2, 1fr); }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 14px 22px; border-radius: 100px;
  font-size: 14px; font-weight: 500; transition: all .18s; letter-spacing: -0.01em;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in oklch, var(--accent) 85%, #fff); }
.btn-ghost { color: var(--fg); border: 1px solid var(--line); }
.btn-ghost:hover { border-color: var(--line-strong); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

.summary-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  /* Lives inside .tour-layout grid as a full-width row; the parent's
     `gap` already spaces it from the columns below, so no margin here. */
  grid-column: 1 / -1;
}
@media (max-width: 720px) {
  .summary-bar { grid-template-columns: repeat(3, 1fr); }
}
.summary-cell { padding: 16px 18px; background: var(--bg-1); display: grid; gap: 4px; }
.summary-cell .lbl {
  font-family: var(--mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-faint);
}
.summary-cell .big {
  font-family: var(--mono); font-size: 22px;
  font-weight: 500; letter-spacing: -0.02em;
}
.summary-cell .big em { font-style: normal; color: var(--fg-dim); font-size: 13px; margin-left: 2px; }

.tweaks-fab {
  position: fixed; bottom: 20px; right: 20px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--bg-1); border: 1px solid var(--line-strong);
  color: var(--fg); display: grid; place-items: center;
  z-index: 40; box-shadow: var(--shadow); transition: transform .2s;
}
.tweaks-fab:hover { transform: scale(1.08); }

.tweaks-panel {
  position: fixed; bottom: 20px; right: 20px;
  width: 320px; max-width: calc(100vw - 40px);
  background: var(--bg-1); border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg); padding: 18px;
  box-shadow: var(--shadow); z-index: 41; display: grid; gap: 14px;
}
.tweaks-panel header { display: flex; justify-content: space-between; align-items: center; }
.tweaks-panel header h3 { margin: 0; font-size: 15px; font-weight: 500; }
.tweaks-panel header .close {
  width: 28px; height: 28px; border-radius: 50%;
  color: var(--fg-dim); display: grid; place-items: center;
}
.tweaks-panel header .close:hover { background: var(--bg-2); color: var(--fg); }
.tweak-row { display: grid; gap: 6px; }
.tweak-row > label {
  font-family: var(--mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-dim);
}
.swatches { display: flex; gap: 8px; }
.swatch-btn {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid transparent; position: relative; transition: all .18s;
}
.swatch-btn::after {
  content: ""; position: absolute; inset: 3px;
  border-radius: 50%; background: var(--s);
}
.swatch-btn[aria-pressed="true"] { border-color: var(--fg); }

/* ========== PLAN GENERATOR ========== */
.plan-placeholder {
  margin: 0;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-size: 14px;
  color: var(--fg-dim);
  font-style: italic;
  font-family: var(--serif);
}

.check-row {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  font-size: 14px;
  color: var(--fg-dim);
}
.check-row input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

.num-input.date-input input {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0;
  color-scheme: dark;
}
[data-theme="dawn"] .num-input.date-input input { color-scheme: light; }

.seg-wrap {
  flex-wrap: wrap;
  border-radius: var(--radius);
  height: auto;
}
.seg-wrap button {
  flex: 0 0 auto;
  border-radius: 100px;
}

.btn-primary:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.btn-primary:disabled:hover { background: var(--accent); }

.stale-banner {
  padding: 10px 14px;
  border-radius: var(--radius);
  background: color-mix(in oklch, var(--warm) 18%, var(--bg));
  border: 1px solid color-mix(in oklch, var(--warm) 38%, var(--line));
  color: var(--fg);
  font-size: 13px;
  line-height: 1.4;
}
.gen-error {
  padding: 10px 14px;
  border-radius: var(--radius);
  background: color-mix(in oklch, var(--danger) 18%, var(--bg));
  border: 1px solid color-mix(in oklch, var(--danger) 38%, var(--line));
  color: var(--fg);
  font-size: 13px;
  line-height: 1.4;
}

.confirm-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: color-mix(in oklch, var(--ok) 18%, var(--bg));
  border: 1px solid color-mix(in oklch, var(--ok) 42%, var(--line));
  color: var(--fg);
  font-size: 13px;
  line-height: 1.4;
  animation: confirm-fade 3.5s ease forwards;
}
.confirm-check {
  display: inline-grid;
  place-items: center;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--ok);
  color: var(--bg);
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
@keyframes confirm-fade {
  0%   { opacity: 0; transform: translateY(-2px); }
  6%   { opacity: 1; transform: none; }
  85%  { opacity: 1; }
  100% { opacity: 0; }
}

.climbing-tag {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-dim);
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.climbing-note {
  padding: 10px 14px;
  border-radius: var(--radius);
  background: color-mix(in oklch, var(--accent) 8%, var(--bg));
  border: 1px solid color-mix(in oklch, var(--accent) 24%, var(--line));
  color: var(--fg-dim);
  font-size: 13px;
  line-height: 1.5;
}

/* ========== PLAN OUTPUT ========== */
.empty-plan {
  min-height: 320px;
  display: grid;
  place-items: center;
  text-align: center;
}
.empty-plan-inner { max-width: 380px; padding: 32px 20px; }
.empty-headline {
  margin: 0 0 12px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  letter-spacing: -0.02em;
}
.empty-subtext {
  margin: 0;
  color: var(--fg-dim);
  font-size: 14px;
  line-height: 1.55;
}

.tc-note {
  margin: 4px 0 0;
  padding-left: 28px;
  font-size: 12px;
  color: var(--fg-dim);
  font-family: var(--serif);
  font-style: italic;
  line-height: 1.4;
}

.est-ftp {
  margin: 2px 0 0;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-dim);
}

/* Collapsible "how inputs affect the plan" note */
.input-info { padding: 0; }
.input-info-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px var(--pad);
  background: none;
  border: none;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  color: var(--fg-dim);
  text-align: left;
}
.input-info-toggle:hover { color: var(--fg); }
.input-info-icon {
  flex: none;
  width: 18px; height: 18px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  font-family: var(--serif);
  font-style: italic;
  font-size: 12px;
  color: var(--fg-faint);
}
.input-info-chevron {
  margin-left: auto;
  font-size: 15px;
  color: var(--fg-faint);
}
.input-info-body {
  padding: 0 var(--pad) 14px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.input-info-body p {
  margin: 0 0 10px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--fg-dim);
}
.input-info-body p:last-child { margin-bottom: 0; }
.input-info-body strong { color: var(--fg); font-weight: 500; }

.phase-strip {
  display: flex;
  gap: 4px;
  height: 56px;
}
.phase-block {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px 12px;
  border-radius: var(--radius);
  background: color-mix(in oklch, var(--phase-color, var(--accent)) 18%, var(--bg));
  border: 1px solid color-mix(in oklch, var(--phase-color, var(--accent)) 38%, var(--line));
  min-width: 0;
  overflow: hidden;
}
.phase-name {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.phase-range {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.vol-bar-btn {
  padding: 0;
  cursor: pointer;
}
.vol-bar.selected {
  outline: 2px solid var(--fg);
  outline-offset: 2px;
}

.week-tabs {
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 3px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 100px;
}
.week-tab {
  padding: 4px 10px;
  font-size: 11px;
  font-family: var(--mono);
  border-radius: 100px;
  color: var(--fg-dim);
  letter-spacing: 0.04em;
  transition: all .18s;
}
.week-tab:hover { color: var(--fg); }
.week-tab[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
}
.week-tab.is-recovery::after {
  content: "·";
  margin-left: 4px;
  color: var(--warm);
}

.rest-placeholder {
  padding: 28px 20px;
  text-align: center;
  color: var(--fg-dim);
  font-family: var(--serif);
  font-style: italic;
  font-size: 17px;
}
.rest-detail { display: grid; gap: 16px; }
.rest-detail h4 {
  margin: 0;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-dim);
}
/* Shared header rhythm for sibling panels (Rest day, Nutrition tips):
   .card-title sits flush (no compounding margin) inside the stack; the
   italic .panel-sub follows; body items below all share the 16px gap. */
.panel-stack { display: grid; gap: 16px; }
.rest-detail > .card-title,
.panel-stack > .card-title { margin-bottom: 0; }
.panel-sub {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  color: var(--fg-dim);
}
.rest-detail-body {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--fg-dim);
}
.rest-detail-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 8px;
  color: var(--fg-dim);
  font-size: 14px;
  line-height: 1.5;
}
.rest-detail-list li {
  position: relative;
  padding-left: 18px;
}
.rest-detail-list li::before {
  content: "–";
  position: absolute;
  left: 0;
  color: var(--fg-faint);
}

/* ========== TOUR PICKER (training event setup) ========== */
.plan-select {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-size: 15px;
  color: var(--fg);
  outline: none;
  cursor: pointer;
  transition: border-color .18s;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-dim) 50%),
                    linear-gradient(135deg, var(--fg-dim) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 32px;
}
.plan-select:focus { border-color: var(--accent); }
.plan-select option { background: var(--bg); color: var(--fg); }

.tour-summary-card {
  display: grid;
  gap: 8px;
  padding: 12px 14px;
  background: color-mix(in oklch, var(--accent) 8%, var(--bg));
  border: 1px solid color-mix(in oklch, var(--accent) 28%, var(--line));
  border-radius: var(--radius);
}
.tour-summary-name {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.tour-summary-stats {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--fg-dim);
}

.save-feedback {
  padding: 8px 12px;
  border-radius: var(--radius);
  background: color-mix(in oklch, var(--ok) 18%, var(--bg));
  border: 1px solid color-mix(in oklch, var(--ok) 38%, var(--line));
  color: var(--fg);
  font-size: 13px;
  text-align: center;
}

/* ========== TOOLTIPS ========== */
.tip-wrap {
  position: relative;
  display: inline-block;
}
.tip-trigger {
  cursor: help;
}
.tip {
  position: absolute;
  z-index: 60;
  padding: 8px 11px;
  background: var(--fg);
  color: var(--bg);
  border-radius: var(--radius-sm);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: 0;
  text-transform: none;
  max-width: 240px;
  width: max-content;
  white-space: normal;
  pointer-events: none;
  box-shadow: var(--shadow);
  animation: tip-in .14s ease;
}
@keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }
.tip-top {
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
}
.tip-top::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--fg);
}
.tip-bottom {
  top: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
}
.tip-bottom::after {
  content: "";
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-bottom-color: var(--fg);
}

/* ========== GLOSSARY ========== */
.glossary-trigger {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: var(--bg-1);
  color: var(--fg-dim);
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 500;
  display: grid;
  place-items: center;
  z-index: 2;
  transition: all .18s;
}
.glossary-trigger:hover {
  color: var(--fg);
  border-color: var(--accent);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  display: grid;
  place-items: center;
  padding: 40px 20px;
  /* Leaflet's internal panes and controls go up to ~700; site chrome uses
     1000. Modal must sit above both. */
  z-index: 2000;
  animation: modal-fade .18s ease;
  overflow: hidden;
}
@keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-1);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 600px;
  width: 100%;
  max-height: 85vh;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.modal-head h2 {
  margin: 0 0 4px;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.modal-sub {
  margin: 0;
  font-size: 13px;
  color: var(--fg-dim);
}
.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--fg-dim);
  display: grid;
  place-items: center;
  font-size: 22px;
  line-height: 1;
  flex-shrink: 0;
  transition: all .18s;
}
.modal-close:hover { color: var(--fg); border-color: var(--line-strong); }
.modal-body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  display: grid;
  align-content: start;
  gap: 22px;
  padding-right: 8px;
  min-height: 0;
  touch-action: pan-y;
}
.gloss-section h3 {
  margin: 0 0 10px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--fg-dim);
  font-weight: 500;
}
.gloss-section dl {
  margin: 0;
  display: grid;
  gap: 12px;
}
.gloss-row { display: grid; gap: 2px; }
.gloss-row dt {
  font-weight: 500;
  font-size: 14px;
  letter-spacing: -0.01em;
}
.gloss-row dd {
  margin: 0;
  font-size: 13px;
  color: var(--fg-dim);
  line-height: 1.5;
}
@media (max-width: 720px) {
  .modal-overlay { padding: 0; }
  .modal {
    max-width: 100%;
    height: 100%;
    max-height: 100%;
    border-radius: 0;
    border: 0;
  }
}

/* ========== WORKOUT PLAIN-LANGUAGE DESCRIPTION ========== */
.workout-plain {
  font-size: 14px;
  color: var(--fg-dim);
  line-height: 1.55;
  font-style: italic;
}
.workout-plain b {
  display: inline-block;
  font-style: normal;
  color: var(--fg);
  font-weight: 500;
  margin-right: 8px;
  text-transform: uppercase;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  vertical-align: baseline;
}

/* ========== NUTRITION TIPS ========== */
.nutr-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.nutr-tab {
  padding: 6px 12px;
  font-size: 12px;
  font-family: var(--mono);
  border-radius: 100px;
  border: 1px solid var(--line);
  color: var(--fg-dim);
  letter-spacing: 0.03em;
  transition: all .18s;
  white-space: nowrap;
}
.nutr-tab:hover { color: var(--fg); border-color: var(--line-strong); }
.nutr-tab.active {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.nutr-tips {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 10px;
}
.nutr-tips li {
  position: relative;
  padding-left: 18px;
  font-size: 14px;
  color: var(--fg-dim);
  line-height: 1.5;
}
.nutr-tips li::before {
  content: "–";
  position: absolute;
  left: 0;
  color: var(--fg-faint);
}
.nutr-note {
  padding: 10px 14px;
  border-radius: var(--radius);
  background: color-mix(in oklch, var(--warm) 10%, var(--bg));
  border: 1px solid color-mix(in oklch, var(--warm) 24%, var(--line));
  color: var(--fg-dim);
  font-size: 13px;
  line-height: 1.5;
  font-style: italic;
}
.dim { color: var(--fg-dim); }
.faint { color: var(--fg-faint); }
.mono { font-family: var(--mono); }
.row { display: flex; gap: 8px; align-items: center; }
.stack { display: grid; gap: 10px; }

.fade-in { animation: fade .35s ease both; }
@keyframes fade {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* ========== WEATHER TAB ========== */
.weather-layout {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
@media (max-width: 980px) {
  .weather-layout { grid-template-columns: 1fr; }
}
.wx3-left { display: grid; gap: 14px; align-content: start; }
.wx3-right { display: grid; gap: 16px; min-width: 0; }

/* ---------- Route map (Leaflet, locked 2.5:1) ---------- */
.wx3-map {
  position: relative;
  width: 100%;
  aspect-ratio: 2.5 / 1;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.wx3-map-canvas { position: absolute; inset: 0; }
.wx3-map .leaflet-container { background: var(--bg-1); }
.wx3-map .leaflet-control-attribution {
  background: rgba(255,255,255,0.7) !important;
  font-size: 9px !important;
  padding: 1px 6px !important;
}

/* Custom divIcon markers — Leaflet's iconAnchor 0,0 centres them via the
   inner .wx3-mk transform so the popup-style card sits centred on the
   lat/lng. */
.wx3-pin-wrap { background: none !important; border: none !important; }
.wx3-mk {
  position: relative;
  transform: translate(-50%, -100%);
  display: grid; gap: 4px; justify-items: center;
  cursor: pointer;
  pointer-events: auto;
  filter: drop-shadow(0 2px 6px rgba(20, 30, 50, 0.18));
}
.wx3-mk-name {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em;
  text-transform: uppercase; color: #0f1a2a;
  background: rgba(255, 255, 255, 0.85);
  padding: 2px 6px; border-radius: 100px;
  white-space: nowrap;
  border: 1px solid rgba(20, 30, 50, 0.08);
}
.wx3-mk.active .wx3-mk-name { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.wx3-mk-body {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px;
  background: #ffffff;
  border: 1px solid rgba(20, 30, 50, 0.12);
  border-radius: 100px;
  font-family: var(--mono); font-size: 11px;
  color: #0f1a2a;
}
.wx3-mk.active .wx3-mk-body { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 35%, transparent); }
.wx3-mk-ic { color: #d68a2e; display: grid; place-items: center; }
.wx3-mk-ic.cool { color: #2a8ec0; }
.wx3-mk-temp { color: #0f1a2a; }
.wx3-mk.climate { opacity: 0.7; filter: saturate(0.55) drop-shadow(0 1px 3px rgba(20,30,50,0.12)); }

.wx3-pin-mid { background: none !important; border: none !important; }
.wx3-mid-mk {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  background: #ffffff;
  border: 1px solid rgba(20, 30, 50, 0.18);
  border-radius: 50%;
  color: #d68a2e;
  opacity: 0.85;
}
.wx3-mid-mk.cool { color: #2a8ec0; }

/* ---------- Stages strip ---------- */
.wx3-stages {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(170px, 1fr);
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  scroll-snap-type: x mandatory;
}
.wx3-stages.few { grid-auto-columns: 1fr; }
.wx3-stage {
  display: grid; gap: 4px;
  padding: 10px 12px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
  min-width: 0;
  scroll-snap-align: start;
}
.wx3-stage:hover { border-color: var(--line-strong); }
.wx3-stage.active {
  border-color: var(--accent);
  background: color-mix(in oklch, var(--accent) 8%, var(--bg-1));
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 18%, transparent);
}
.wx3-stage.climate { opacity: 0.78; filter: saturate(0.6); }
.wx3-stage .num { font-family: var(--mono); font-size: 9px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: 0.1em; }
.wx3-stage .day { font-family: var(--mono); font-size: 10px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.04em; }
.wx3-stage .place {
  font-size: 13px; font-weight: 500; letter-spacing: -0.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.wx3-stage .meta { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; margin-top: 2px; }
.wx3-stage .meta .ic { color: var(--warm); display: grid; place-items: center; }
.wx3-stage .meta .ic.cool { color: var(--accent); }
.wx3-stage .meta .temp { color: var(--fg); }
.wx3-stage .summary { font-size: 11px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wx3-stage-spark { display: flex; align-items: end; gap: 6px; margin-top: 4px; }
.wx3-stage-spark .mm { font-family: var(--mono); font-size: 10px; color: var(--fg-dim); white-space: nowrap; }

.wx3-spark {
  flex: 1; min-width: 0;
  display: flex; align-items: end; gap: 1px;
  height: 24px;
  padding: 1px 2px;
  background: color-mix(in oklch, var(--accent) 4%, var(--bg));
  border-radius: 4px;
}
.wx3-spark-col {
  flex: 1; min-height: 2px;
  background: var(--accent);
  border-top: 1px solid color-mix(in oklch, var(--accent) 50%, transparent);
  border-radius: 1px 1px 0 0;
}
.wx3-spark-empty {
  background: transparent;
  font-family: var(--mono); font-size: 10px; color: var(--fg-faint);
  align-items: center; justify-content: center;
  padding-left: 4px;
}

/* ---------- Stage detail (forecast mode) ---------- */
.wx3-detail {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: grid; gap: 18px;
}
.wx3-detail .header .label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-dim); }
.wx3-detail .header h2 {
  margin: 6px 0 0;
  font-family: var(--serif); font-style: italic; font-weight: 400;
  font-size: 28px; line-height: 1.2; letter-spacing: -0.01em;
  color: var(--fg);
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
.wx3-hl-ic { color: var(--warm); display: inline-grid; place-items: center; transform: translateY(4px); }
.wx3-hl-ic.cool { color: var(--accent); }

.wx3-stats { display: flex; gap: 32px; flex-wrap: wrap; }
.wx3-stats > div { display: grid; gap: 4px; }
.wx3-stats .l { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-faint); }
.wx3-stats .v { font-family: var(--mono); font-size: 18px; color: var(--fg); }

.wx3-divider { height: 1px; background: var(--line); margin: 2px 0; }

/* Wind card */
.wx3-wind {
  display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
  padding: 14px 18px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg);
}
.wx3-wind .arrow {
  width: 56px; height: 56px;
  display: grid; place-items: center;
  border-radius: 100px;
  background: var(--bg-1);
  border: 1.5px solid var(--line-strong);
}
.wx3-wind .arrow svg { transition: transform .25s ease; }
.wx3-wind .data .speed { font-family: var(--mono); font-size: 22px; color: var(--fg); }
.wx3-wind .data .label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

/* Rain timeline */
.wx3-rain { display: grid; gap: 10px; }
.wx3-rain-cap {
  font-family: var(--mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--fg-dim);
}
.wx3-rain-cap .peak { color: var(--fg-faint); }
.wx3-rain-chart-wrap { display: flex; gap: 10px; padding-bottom: 22px; }
.wx3-rain-yaxis {
  display: flex; flex-direction: column; justify-content: space-between;
  height: 160px;
  font-family: var(--mono); font-size: 10px; color: var(--fg-faint);
  text-align: right; min-width: 24px;
}
.wx3-rain-chart {
  flex: 1; min-width: 0; position: relative; height: 160px;
}
.wx3-rain-grid {
  position: absolute; left: 0; right: 0; height: 1px;
  background: var(--line);
  pointer-events: none;
}
.wx3-rain-cols {
  position: absolute; inset: 0;
  display: flex; align-items: end; gap: 2px;
}
.wx3-rain-col-wrap {
  flex: 1; min-width: 0; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: end;
  position: relative;
}
.wx3-rain-col {
  width: 80%; min-height: 2px;
  background: var(--accent);
  border: 1px solid color-mix(in oklch, var(--accent) 55%, transparent);
  border-radius: 3px 3px 0 0;
  transition: opacity .15s ease;
}
.wx3-rain-col-wrap:hover .wx3-rain-col { opacity: 1 !important; outline: 1px solid var(--accent); outline-offset: 1px; }
.wx3-rain-xlabel {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-family: var(--mono); font-size: 10px; color: var(--fg-dim);
  white-space: nowrap;
}

/* "No rain" panel — replaces the chart on dry days */
.wx3-norain {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px;
  background: color-mix(in oklch, var(--warm) 6%, var(--bg));
  border: 1px dashed color-mix(in oklch, var(--warm) 30%, var(--line));
  border-radius: var(--radius);
}
.wx3-norain .ic { color: var(--warm); display: grid; place-items: center; }
.wx3-norain .t { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--fg); }

/* Hourly strip */
.wx3-hourly {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(52px, 1fr);
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.wx3-hourly-cell {
  display: grid; gap: 6px; justify-items: center;
  padding: 12px 6px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: color-mix(in oklch, var(--bg-1) 50%, var(--bg));
  min-width: 0;
}
.wx3-hourly-cell .hr { font-family: var(--mono); font-size: 10px; color: var(--fg-dim); letter-spacing: 0.04em; }
.wx3-hourly-cell .ic { color: var(--warm); display: grid; place-items: center; }
.wx3-hourly-cell .ic.cool { color: var(--accent); }
.wx3-hourly-cell .t { font-family: var(--mono); font-size: 12px; color: var(--fg); }
.wx3-hourly-cell .p { font-family: var(--mono); font-size: 10px; color: var(--accent); min-height: 12px; }

/* Climate fallback */
.wx3-climate {
  background: color-mix(in oklch, var(--bg-1) 60%, var(--bg));
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: grid; gap: 16px;
  filter: saturate(0.85);
}
.wx3-climate .head .label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-dim); }
.wx3-climate .head h2 {
  margin: 6px 0 0;
  font-family: var(--serif); font-style: italic; font-weight: 400;
  font-size: 24px; line-height: 1.2; color: var(--fg);
}
.wx3-climate .head .src { font-family: var(--mono); font-size: 10px; color: var(--fg-faint); margin-top: 6px; }
.wx3-climate .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 720px) { .wx3-climate .grid { grid-template-columns: repeat(2, 1fr); } }
.wx3-climate .grid .l { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-faint); }
.wx3-climate .grid .v { font-family: var(--mono); font-size: 18px; color: var(--fg); margin-top: 4px; display: block; }
.wx3-climate .note { margin: 0; font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--fg-dim); }

/* Left-column extras */
.wx3-outlook { display: grid; gap: 10px; }
.wx3-outlook .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.wx3-outlook .row.split { flex-direction: column; align-items: stretch; gap: 2px; }
.wx3-outlook .l { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-faint); }
.wx3-outlook .v { font-family: var(--mono); font-size: 14px; color: var(--fg); text-align: right; }
.wx3-outlook .row.split .v { text-align: left; }
.wx3-outlook .v em { display: block; font-style: normal; color: var(--fg-dim); font-size: 11px; margin-top: 1px; }
.wx3-outlook-note { font-family: var(--serif); font-style: italic; color: var(--fg-dim); font-size: 13px; line-height: 1.4; }

.wx3-tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.wx3-tips li {
  position: relative;
  padding-left: 16px;
  font-size: 13px;
  color: var(--fg);
  line-height: 1.45;
}
.wx3-tips li::before {
  content: "–";
  position: absolute; left: 0;
  color: var(--fg-faint);
}
.wx3-tips-empty { font-family: var(--serif); font-style: italic; color: var(--fg-dim); font-size: 13px; }
.wx3-tips-note { margin-top: 8px; font-family: var(--mono); font-size: 10px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: 0.06em; }

/* Loading skeleton for AI-generated packing tips. Five thin bars at
   varied widths fading in/out — feels like a list being populated. */
.wx3-tips-skel { display: grid; gap: 10px; padding: 4px 0; }
.wx3-tips-skel > div {
  height: 10px;
  border-radius: 4px;
  background: linear-gradient(
    90deg,
    color-mix(in oklch, var(--line) 50%, transparent) 0%,
    color-mix(in oklch, var(--line-strong) 80%, transparent) 50%,
    color-mix(in oklch, var(--line) 50%, transparent) 100%
  );
  background-size: 200% 100%;
  animation: wx3-skel-pulse 1.2s ease-in-out infinite;
}
.wx3-tips-skel > div:nth-child(1) { width: 92%; }
.wx3-tips-skel > div:nth-child(2) { width: 78%; }
.wx3-tips-skel > div:nth-child(3) { width: 85%; }
.wx3-tips-skel > div:nth-child(4) { width: 70%; }
.wx3-tips-skel > div:nth-child(5) { width: 80%; }
@keyframes wx3-skel-pulse {
  0%   { background-position: 200% 0; opacity: 0.7; }
  50%  { opacity: 1; }
  100% { background-position: -200% 0; opacity: 0.7; }
}

/* Regenerate button — discreet round icon button beside the heading. */
.wx3-tips-regen {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px;
  padding: 0;
  border-radius: 100px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--fg-dim);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.wx3-tips-regen:hover:not(:disabled) {
  color: var(--fg);
  border-color: var(--line-strong);
  background: color-mix(in oklch, var(--accent) 8%, transparent);
}
.wx3-tips-regen:disabled { opacity: 0.5; cursor: default; }
.wx3-tips-regen .spin { display: inline-block; animation: wx3-spin 0.9s linear infinite; }
@keyframes wx3-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.empty-wx {
  display: grid; place-items: center; text-align: center;
  padding: 50px 30px; gap: 14px;
  border: 1px dashed var(--line-strong); border-radius: var(--radius-lg);
  color: var(--fg-dim);
}
.empty-wx svg { color: var(--fg-faint); }
.empty-wx h3 { margin: 0; font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--fg); }
.empty-wx p { margin: 0; font-size: 14px; max-width: 360px; line-height: 1.5; }
.empty-wx .picker {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: var(--bg-1); border: 1px solid var(--line-strong);
  border-radius: 100px;
  font-size: 14px; color: var(--fg);
}

.tour-summary-card {
  display: grid; gap: 6px;
  padding: 12px 14px;
  background: color-mix(in oklch, var(--accent) 7%, var(--bg));
  border: 1px solid color-mix(in oklch, var(--accent) 26%, var(--line));
  border-radius: var(--radius);
}
.tsc-name { font-size: 13px; font-weight: 500; }
.tsc-stats { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }

.plan-select {
  width: 100%; padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
  font-size: 14px; color: var(--fg); font-family: var(--sans);
}
.plan-select:focus { outline: none; border-color: var(--accent); }

.section-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; gap: 12px; }
.section-title h2 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
.section-title h3 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -0.02em; }
.section-title .sub { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-faint); }

/* ========== PLAN ACTIONS (PDF + ICS) ========== */
.plan-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.plan-actions .btn {
  flex: 1 1 200px;
  justify-content: center;
}
.download-pdf-btn,
.download-ics-btn {
  width: 100%;
  justify-content: center;
}

/* ========== CITY AUTOCOMPLETE ========== */
.city-ac-list {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 200;
  background: var(--bg-1);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  list-style: none;
  margin: 0;
  padding: 4px 0;
  max-height: 280px;
  overflow-y: auto;
}
.city-ac-opt {
  padding: 10px 14px;
  font-size: 13px;
  cursor: pointer;
  line-height: 1.3;
  color: var(--fg);
  transition: background .1s;
}
.city-ac-opt:hover,
.city-ac-active {
  background: color-mix(in oklch, var(--accent) 12%, var(--bg-2));
  color: var(--accent);
}
.city-ac-empty {
  padding: 10px 14px;
  font-size: 12px;
  color: var(--fg-dim);
  font-style: italic;
}

/* ========== PRINT VIEW (hidden on screen) ========== */
.print-view { display: none; }

@media print {
  /* Hide everything except the portaled .print-view */
  body > *:not(.print-view) { display: none !important; }
  .print-view { display: block !important; }

  @page {
    size: A4;
    margin: 18mm 15mm;
  }

  html, body {
    background: #ffffff !important;
    color: #000000 !important;
  }

  body {
    font-family: var(--serif), Georgia, serif;
  }

  .print-view {
    color: #000;
    background: #fff;
    font-size: 10pt;
    line-height: 1.45;
  }
  .print-view * {
    color: #000;
    background: transparent;
    box-shadow: none;
    text-shadow: none;
  }

  .print-view h1, .print-view h2, .print-view h3 {
    font-family: var(--serif), Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* Cover page */
  .print-cover {
    page-break-after: always;
    break-after: page;
    text-align: left;
    padding-top: 30mm;
  }
  .print-logo {
    font-family: var(--serif), Georgia, serif;
    font-style: italic;
    font-size: 14pt;
    margin-bottom: 12mm;
  }
  .print-title {
    font-size: 28pt;
    margin: 0 0 8mm;
    font-style: italic;
    font-weight: 500;
  }
  .print-event-line {
    font-size: 13pt;
    margin: 0 0 4mm;
    font-style: normal;
  }
  .print-generated {
    font-size: 9pt;
    color: #555 !important;
    margin: 0;
  }

  /* Generic section */
  .print-section, .print-schedule, .print-appendix {
    page-break-inside: auto;
  }
  .print-section { margin-bottom: 8mm; }
  .print-section h2,
  .print-schedule h2,
  .print-appendix h2 {
    font-size: 16pt;
    margin: 0 0 4mm;
    border-bottom: 1px solid #999;
    padding-bottom: 2mm;
  }
  .print-section h3,
  .print-schedule h3,
  .print-appendix h3 {
    font-size: 12pt;
    margin: 4mm 0 2mm;
  }
  .print-sub {
    font-size: 9pt;
    color: #555 !important;
    font-style: italic;
    margin: 0 0 4mm;
  }

  /* Key-value lists */
  .print-kv {
    display: grid;
    grid-template-columns: 38mm 1fr;
    gap: 1mm 4mm;
    margin: 0;
    font-family: Georgia, serif;
  }
  .print-kv dt {
    font-weight: 600;
  }
  .print-kv dd {
    margin: 0;
  }

  /* Weekly schedule */
  .print-schedule {
    page-break-before: always;
    break-before: page;
  }
  .print-week {
    page-break-inside: avoid;
    break-inside: avoid;
    margin-bottom: 6mm;
    padding-bottom: 2mm;
    border-bottom: 1px solid #ddd;
  }
  .print-week:last-child { border-bottom: 0; }
  .print-day-table {
    width: 100%;
    border-collapse: collapse;
    margin: 1mm 0 2mm;
    font-size: 10pt;
  }
  .print-day-table td {
    padding: 0.6mm 0;
    vertical-align: top;
  }
  .print-day-name {
    width: 22mm;
    font-family: Georgia, serif;
    color: #333 !important;
  }
  .print-day-workout {
    width: 45mm;
  }
  .print-day-rest {
    color: #777 !important;
    font-style: italic;
  }
  .print-day-metrics {
    text-align: right;
    color: #444 !important;
    font-size: 9pt;
  }
  .print-intervals {
    margin: 1mm 0 0 6mm;
    padding: 0;
    list-style: none;
    font-size: 9pt;
    color: #333 !important;
  }
  .print-intervals li {
    margin: 0.5mm 0;
    line-height: 1.3;
  }

  /* Appendix sections start on a new page */
  .print-appendix {
    page-break-before: always;
    break-before: page;
  }
  .print-nutr,
  .print-gloss {
    page-break-inside: avoid;
    break-inside: avoid;
    margin-bottom: 5mm;
  }
  .print-nutr ul {
    margin: 0 0 0 5mm;
    padding: 0;
  }
  .print-nutr li {
    margin: 1mm 0;
  }
  .print-gloss dl {
    margin: 0;
  }
  .print-gloss dt {
    font-weight: 600;
    margin-top: 2mm;
  }
  .print-gloss dd {
    margin: 0 0 1mm 0;
    color: #333 !important;
  }
}
</style>
